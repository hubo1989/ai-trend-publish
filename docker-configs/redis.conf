# Redis配置文件

# 网络配置
bind 0.0.0.0
port 6379
timeout 300
keepalive 60

# 内存配置
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# 持久化配置
# RDB快照
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# AOF持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 日志配置
loglevel notice
logfile /var/log/redis/redis-server.log

# 安全配置
# requirepass your-redis-password

# 客户端连接
maxclients 1000

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 其他配置
tcp-keepalive 300
databases 16

