version: '3.8'

services:
  # 后端API服务
  backend:
    image: ${BACKEND_IMAGE:-ai-trend-backend:latest}
    container_name: ai-trend-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # 前端Web服务
  frontend:
    image: ${FRONTEND_IMAGE:-ai-trend-frontend:latest}
    container_name: ai-trend-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped

  # 数据库服务
  db:
    image: mysql:${MYSQL_VERSION:-8.0}
    container_name: ai-trend-db
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-trendfinder}
      MYSQL_USER: ${DB_USER:-trendfinder}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped

  # Redis缓存服务
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: ai-trend-redis
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
